# TOPO ONE — Cloudflare Pages (frontend) + Pages Functions (API) + D1 (banco)
name = "topo-one"
pages_build_output_dir = "public"
compatibility_date = "2025-09-01"

[[d1_databases]]
binding = "DB"
database_name = "topo-one"
# Banco D1 "topo-one" criado na conta Cloudflare (o ID não é segredo).
database_id = "5e87dda0-6eb1-4866-b526-4e23ae3c79fc"
migrations_dir = "migrations"

[vars]
# Iterações do hash de senha (máximo aceito pelo Workers: 100000).
PBKDF2_ITER = "100000"

# Segredos (NUNCA neste arquivo): defina no painel da Cloudflare ou com "wrangler pages secret put":
#   SETUP_TOKEN     -> código para criar o primeiro administrador (apague depois do primeiro acesso)
#   WEBHOOK_SECRET  -> chave para assinar os envios das automações
