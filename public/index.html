:root{
  --navy:#0F1837;--navy-2:#13285a;--blue:#598DDC;--blue-strong:#3B76D6;--blue-soft:#E8F1FD;
  --ink:#0F1837;--ink-2:#4A5B7C;--ink-3:#7487A6;--line:#DCE6F4;--surface:#FFFFFF;--canvas:#EEF4FC;
  --ok:#17785C;--ok-bg:#DFF7EC;--warn:#A9620F;--warn-bg:#FFF0D9;--danger:#B4332F;--danger-bg:#FDE6E4;
  --cyan:#5AD2FF;
  --radius-l:20px;--radius-m:14px;--radius-s:10px;
  --shadow:0 10px 30px rgba(21,48,96,.08);
  --side-w:264px;
  --orb:124px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Montserrat,"Segoe UI",Arial,sans-serif;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ico{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh;background:linear-gradient(112deg,#F7FAFF,#E3EFFD)}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(170deg,#0F1837 0%,#11295A 55%,#0F1837 100%);color:#fff;padding:26px 14px 18px;display:flex;flex-direction:column;gap:24px;z-index:20}
.brand{padding:0 14px}
.brand img{width:150px;height:auto;display:block}
.brand small{display:block;margin-top:10px;color:#A9C3EE;font-size:10px;font-weight:600;letter-spacing:.14em}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:13px;padding:11px 14px;border-radius:12px;color:#C9D7F0;text-decoration:none;font-size:13px;font-weight:600;min-height:46px}
.nav a small{display:block;font-size:10px;font-weight:500;color:#8FA8D3;margin-top:2px}
.nav a:hover{background:rgba(89,141,220,.18);color:#fff}
.nav a[aria-current="page"]{background:linear-gradient(110deg,#3676D5,#6D9FF0);color:#fff;box-shadow:0 8px 22px rgba(4,12,40,.35)}
.nav a[aria-current="page"] small{color:#E2EDFF}
.side-foot{margin-top:auto;padding:12px 14px;font-size:11px;line-height:1.7;color:#A9BEE0;border-top:1px solid rgba(255,255,255,.08)}
.side-foot b{color:#fff}

.main{min-width:0;padding:18px 28px 36px}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:18px;position:relative}
.menu-btn{display:none;border:1px solid var(--line);background:#fff;border-radius:12px;width:46px;height:46px;place-items:center;color:var(--navy)}
.mobile-logo{display:none;height:28px}
.search{flex:1;position:relative}
.search-box{height:48px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:0 8px 0 16px;box-shadow:0 4px 16px rgba(25,54,97,.06)}
.search-box .ico{color:var(--ink-3)}
.search-box input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px}
.icon-btn{border:0;background:transparent;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:#1E4B91;position:relative}
.icon-btn:hover{background:var(--blue-soft)}
.icon-btn.mic{background:var(--blue-soft)}
.badge-dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:#E0553F;color:#fff;font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.top-actions{display:flex;align-items:center;gap:8px}
.profile{display:flex;align-items:center;gap:10px;font-size:12px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--blue-strong);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.profile small{display:block;color:var(--ink-3);font-size:11px}
.dropdown{position:absolute;top:56px;background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);box-shadow:0 18px 40px rgba(15,24,55,.16);padding:8px;z-index:30;max-height:60vh;overflow:auto}
.dropdown[hidden]{display:none}
.search .dropdown{left:0;right:0}
.notif-wrap{position:relative}
.notif-wrap .dropdown{right:0;width:min(340px,86vw)}
.dd-title{font-size:11px;font-weight:700;color:var(--ink-3);padding:8px 10px 4px}
.dd-item{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:0;background:none;padding:10px;border-radius:10px;font-size:12px;text-decoration:none;color:var(--ink)}
.dd-item:hover{background:var(--blue-soft)}
.dd-item small{display:block;color:var(--ink-3);font-size:11px;margin-top:2px}
.dd-empty{padding:12px 10px;font-size:12px;color:var(--ink-3)}

.screen{display:none}
.screen.active{display:block;animation:screenIn .25s ease}
@keyframes screenIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:4px 0 18px;flex-wrap:wrap}
.page-head h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 4px}
.page-head p{margin:0;color:var(--ink-3);font-size:13px}
.demo-tag{display:inline-flex;align-items:center;gap:6px;background:var(--warn-bg);color:#7A5418;border:1px solid #F3D9A6;border-radius:20px;padding:5px 11px;font-size:11px;font-weight:650}
.panel{background:var(--surface);border:1px solid #E3ECF8;border-radius:var(--radius-m);padding:18px;box-shadow:var(--shadow)}
.panel h2,.panel h3{font-size:14px;font-weight:700;margin:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.panel-head .meta{font-size:11px;color:var(--ink-3);white-space:nowrap}
.btn{border:0;border-radius:11px;padding:11px 16px;font-size:13px;font-weight:650;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn .ico{width:16px;height:16px}
.btn-primary{background:var(--blue-strong);color:#fff}
.btn-primary:hover{background:#2F66C0}
.btn-ghost{background:#fff;color:#1D4C95;border:1px solid var(--line)}
.btn-ghost:hover{background:var(--blue-soft)}
.btn-link{border:0;background:none;color:var(--blue-strong);font-weight:700;font-size:12px;padding:4px;text-decoration:none}
.btn-danger{background:#fff;color:var(--danger);border:1px solid #F3C9C5}
.status{display:inline-block;border-radius:20px;padding:4px 9px;font-size:11px;font-weight:700;background:#E2EFFF;color:#2D68BF;white-space:nowrap}
.status.ok{background:var(--ok-bg);color:var(--ok)}
.status.warn{background:var(--warn-bg);color:var(--warn)}
.status.danger{background:var(--danger-bg);color:var(--danger)}
.status.muted{background:#EEF2F8;color:var(--ink-2)}
.note{background:#FFF6E3;border-radius:10px;padding:10px 12px;color:#7D5B14;font-size:12px;line-height:1.55;margin-top:12px}
.empty{padding:28px 10px;text-align:center;color:var(--ink-3);font-size:13px}

/* ---------- Início: anel TOPO AI ---------- */
.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,360px);grid-template-areas:"hero side" "bottom bottom";gap:18px;align-items:start}
.hero{grid-area:hero;display:flex;justify-content:center;align-items:center;padding:6px 0 10px}
.ring-stage{width:min(100%,680px);padding:calc(var(--orb) / 2 + 6px)}
.ring{position:relative;aspect-ratio:1;border-radius:50%;border:1px solid #B5CEF2;background:radial-gradient(circle,#EDF5FF 0%,#E3EEFB 58%,rgba(218,234,253,.4) 74%,transparent 75%)}
.ring::before{content:"";position:absolute;inset:15%;border-radius:50%;border:1px dashed #BAD3F5}

@keyframes breathe{50%{filter:brightness(1.18) saturate(1.1)}}
.core-label{position:absolute;left:0;right:0;bottom:0;padding:38px 10px 18%;background:linear-gradient(0deg,#081735 10%,rgba(8,23,53,.85) 62%,transparent);display:flex;flex-direction:column;align-items:center;gap:7px;color:#fff}
.core-label strong{font-size:clamp(20px,2.6vw,34px);font-weight:800;letter-spacing:.01em;line-height:1}
.core-label strong span{color:#6FA8FF}
.live{display:flex;align-items:center;gap:7px;font-size:11px;color:#D9E8FF}
.live i{width:8px;height:8px;border-radius:50%;background:#1DE5BE;box-shadow:0 0 10px #1DE5BE}
.wave{display:flex;align-items:center;gap:3px;height:18px}
.wave span{width:3px;border-radius:2px;background:#6FD3FF;height:30%;animation:wave 1.4s ease-in-out infinite;animation-delay:calc(var(--i) * -0.11s)}
@keyframes wave{0%,100%{height:22%}50%{height:100%}}
.talk-chip{display:inline-flex;align-items:center;gap:7px;background:linear-gradient(110deg,#377CE4,#5A9CF9);border:1px solid #B9D9FF;border-radius:24px;padding:8px 14px;font-size:11px;font-weight:700;box-shadow:0 0 18px rgba(78,154,255,.55)}
.talk-chip .ico{width:14px;height:14px}
.orb{position:absolute;left:calc(50% + var(--x) * 50%);top:calc(50% + var(--y) * 50%);transform:translate(-50%,-50%);width:var(--orb);height:var(--orb);border-radius:50%;border:1px solid #fff;background:radial-gradient(circle at 32% 14%,#fff,#E6EDF7);box-shadow:0 10px 26px rgba(46,92,152,.18),inset 0 0 20px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--navy);text-decoration:none;transition:transform .2s ease, box-shadow .2s;z-index:2}
.orb:hover{transform:translate(-50%,-50%) scale(1.06);box-shadow:0 12px 30px rgba(46,92,152,.3),0 0 0 3px #9FC6FF}
.orb .ico{width:30px;height:30px;color:#1A4589;stroke-width:1.5}
.orb b{font-size:12px;font-weight:700}
.orb .num{position:absolute;top:-4px;right:2px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#F7FBFF;border:1px solid #DCE9FA;box-shadow:0 3px 10px rgba(32,68,112,.14);font-size:11px;font-weight:700;color:#22519A}
.orb.primary{background:radial-gradient(circle at 40% 15%,#6AA9FA,#2D6DD2);color:#fff;border:2px solid #A3C8FF;box-shadow:0 0 24px rgba(108,157,228,.8)}
.orb.primary .ico{color:#fff}
.orb.primary .num{background:#1F53A6;color:#fff;border-color:#2F66C0}
.module-grid{display:none}

.side-col{grid-area:side;display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#F2F7FF;border-radius:12px;padding:14px 12px;min-height:78px}
.kpi strong{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.kpi small{display:block;margin-top:5px;font-size:11px;color:var(--ink-2)}
.bars{height:140px;display:flex;align-items:flex-end;gap:12px;border-bottom:1px solid var(--line);padding:4px 6px}
.bar-col{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.bar{width:100%;max-width:30px;border-radius:6px 6px 0 0;background:linear-gradient(#7FADF5,#3575D4)}
.bar-col small{font-size:10px;color:var(--ink-3)}
.chart-note{font-size:11px;color:var(--ink-3);margin:8px 0 0}
.list-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #EDF2FA}
.list-row:first-of-type{border-top:0}
.list-icon{width:42px;height:42px;border-radius:11px;background:var(--blue-soft);color:#336EC0;display:grid;place-items:center;flex-shrink:0}
.list-main{flex:1;min-width:0;display:grid;gap:3px}
.list-main b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-main small{font-size:11px;color:var(--ink-3)}
.list-row>strong{font-size:12px;white-space:nowrap}
.bottom{grid-area:bottom;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.mini{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #EEF2F8;font-size:12px}
.mini:first-of-type{border-top:0}
.mini label{display:flex;gap:9px;align-items:center;cursor:pointer;min-width:0}
.mini input{accent-color:var(--blue-strong);width:16px;height:16px;flex-shrink:0}
.mini .done{text-decoration:line-through;color:var(--ink-3)}
.mini small{color:var(--ink-3);white-space:nowrap}

/* ---------- Módulos ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:200px}
.input,.select,textarea.input{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;font-size:13px;outline-color:var(--blue)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 13px;font-size:12px;font-weight:650;color:var(--ink-2)}
.tab[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.table-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table.data{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
.data th{text-align:left;font-size:11px;font-weight:700;color:var(--ink-3);padding:12px 10px;border-bottom:1px solid var(--line)}
.data td{padding:13px 10px;border-bottom:1px solid #EEF2F7;vertical-align:middle}
.data tr:last-child td{border-bottom:0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:grid;gap:6px;font-size:12px;font-weight:650;color:var(--ink-2)}
.field.full{grid-column:1/-1}
.form-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap}
.stack{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.stack>*,.split>*{min-width:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius-m);padding:18px;display:grid;gap:8px;align-content:start}
.card b{font-size:14px}
.card p{margin:0;color:var(--ink-2);font-size:12px;line-height:1.65}
.card .big{font-size:26px;font-weight:800;letter-spacing:-.02em}
.card-icon{width:40px;height:40px;border-radius:11px;background:var(--blue-soft);color:#2E64B5;display:grid;place-items:center}
.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px}
.perm{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #EEF2F8;font-size:13px}
.perm:first-child{border-top:0}
.plan-list{margin:0;padding-left:18px;color:var(--ink-2);font-size:13px;line-height:1.9}
.fin-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:13px 0;border-top:1px solid #EEF2F8}
.fin-row:first-of-type{border-top:0}
.fin-row .list-main{flex:1 1 240px}
.fin-row>strong{font-size:14px;white-space:nowrap}
.fin-row details{flex-basis:100%;font-size:12px;color:var(--ink-2)}
.fin-row summary{cursor:pointer;color:var(--blue-strong);font-weight:650}
.hist{padding:4px 0 0 12px}
.task-row{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid #EEF2F8}
.task-row:first-child{border-top:0}
.task-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--blue-strong);flex-shrink:0}
.task-row .list-main b{white-space:normal}
.task-row.done b{text-decoration:line-through;color:var(--ink-3)}

/* ---------- TOPO AI (conversa) ---------- */
.ai-modal{position:fixed;inset:0;background:rgba(7,18,41,.78);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.ai-modal.open{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}}
.ai-box{width:min(880px,100%);max-height:94vh;display:grid;grid-template-columns:300px minmax(0,1fr);background:#fff;border-radius:24px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.45)}
.ai-visual{background:radial-gradient(circle at 50% 36%,#1B4B8F,#0A1A3A 62%,#06112A);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 18px;text-align:center}

.ai-face .halo{position:absolute;inset:-12px;border-radius:50%;border:2px solid transparent}
.ai-state{font-size:13px;font-weight:700}
.ai-sub{font-size:11px;color:#A9C6F0;max-width:220px;line-height:1.5}
.ai-visual .wave{height:28px}
.ai-visual .wave span{animation-play-state:paused;height:20%}
[data-ai="ouvindo"] .ai-visual .wave span,[data-ai="transcrevendo"] .ai-visual .wave span{animation-play-state:running;animation-duration:.7s}
[data-ai="respondendo"] .ai-visual .wave span{animation-play-state:running;animation-duration:1s;background:#A5E4FF}
[data-ai="ouvindo"] .ai-face .img,[data-ai="transcrevendo"] .ai-face .img{animation:pulse .6s ease-in-out infinite alternate}
[data-ai="respondendo"] .ai-face .img{animation:pulse 1s ease-in-out infinite alternate}
[data-ai="processando"] .ai-face .halo,[data-ai="pensando"] .ai-face .halo{border-top-color:#5AD2FF;border-right-color:rgba(90,210,255,.35);animation:spin 1s linear infinite}
[data-ai="abrindo"] .ai-face .img{animation:pulse .4s ease-in-out 2 alternate}
[data-ai="erro"] .ai-face .img,[data-ai="microfone_negado"] .ai-face .img{border-color:#FF8A7A;box-shadow:0 0 26px rgba(255,120,100,.4)}
@keyframes pulse{from{box-shadow:0 0 16px rgba(61,168,255,.45)}to{box-shadow:0 0 60px #3DE7FF}}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-chat{display:flex;flex-direction:column;min-height:540px;max-height:94vh;padding:18px 20px}
.ai-head{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}
.ai-head b{font-size:15px}
.ai-head small{display:block;color:var(--ink-3);font-size:11px;margin-top:2px}
.ai-controls{display:flex;gap:6px}
.ai-controls .icon-btn{background:var(--blue-soft)}
.ai-controls .icon-btn[aria-pressed="true"]{background:var(--navy);color:#fff}
.voice-bar{display:flex;align-items:center;gap:8px;padding:10px 0 2px;font-size:12px;font-weight:650;color:var(--ink-2)}
.voice-bar select{flex:1;min-width:0;padding:8px 10px;font-size:12px}
.voice-bar .btn{padding:8px 12px;font-size:12px}
.messages{flex:1;overflow-y:auto;padding:14px 2px;display:flex;flex-direction:column;gap:10px;min-height:200px}
.bubble{max-width:88%;padding:11px 13px;border-radius:15px;font-size:13px;line-height:1.6;background:#EEF4FC;align-self:flex-start;white-space:pre-line}
.bubble.user{background:var(--blue-strong);color:#fff;align-self:flex-end}
.bubble.interim{opacity:.6;font-style:italic}
.ai-cards{display:grid;gap:8px;align-self:stretch;max-width:92%}
.ai-card{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:12px;background:#fff;text-decoration:none;color:var(--ink)}
.ai-card small{display:block;color:var(--ink-3);font-size:11px}
.ai-card .status{margin-left:auto}
.ai-input{display:flex;gap:8px;margin-top:8px}
.ai-input input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
.ai-input .mic-big{width:46px;height:46px;border-radius:12px;border:0;background:var(--blue-soft);color:#1E4B91;display:grid;place-items:center}
[data-ai="ouvindo"] .mic-big{background:#E0553F;color:#fff}

/* ---------- Tablet / retrato 3:4 ---------- */
@media (max-width:1280px){ :root{--orb:110px} .home{grid-template-columns:minmax(0,1fr) 320px} }
@media (max-width:1180px){
  :root{--side-w:84px;--orb:112px}
  .brand{padding:0;display:flex;justify-content:center}
  .brand img{width:56px;height:30px;object-fit:cover;object-position:left}
  .brand small,.nav a span,.side-foot{display:none}
  .nav a{justify-content:center;padding:12px}
  .home{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "side" "bottom"}
  .ring-stage{width:min(100%,620px)}
  .side-col{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side-col .auctions{grid-column:1/-1}
  .profile div{display:none}
}
@media (max-width:1180px) and (min-width:761px){
  .bottom{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bottom>:last-child{grid-column:1/-1}
  .split{grid-template-columns:1fr}
}

/* ---------- Celular ---------- */
@media (max-width:760px){
  body{font-size:13px}
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:280px;transform:translateX(-105%);transition:transform .22s ease;visibility:hidden}
  .side.open{transform:none;visibility:visible;box-shadow:20px 0 60px rgba(0,0,0,.35)}
  .brand{display:block;padding:0 14px}
  .brand img{width:140px;height:auto;object-fit:contain}
  .brand small,.nav a span,.side-foot{display:block}
  .nav a{justify-content:flex-start;padding:11px 14px}
  .scrim{position:fixed;inset:0;background:rgba(7,18,41,.5);z-index:15}
  .main{padding:12px 14px 30px}
  .topbar{flex-wrap:wrap;gap:10px}
  .menu-btn{display:grid}
  .mobile-logo{display:block}
  .top-actions{margin-left:auto}
  .search{order:5;flex-basis:100%}
  .profile{display:none}
  .page-head h1{font-size:20px}
  .hero{flex-direction:column;gap:16px;padding:4px 0}
  .ring-stage{padding:0;width:100%;display:flex;justify-content:center}
  .ring{width:min(78vw,300px);border:0;background:none}
  .ring::before,.orb{display:none}
  .core{inset:0}
  .core-label strong{font-size:24px}
  .module-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
  .module-grid a{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px;font-weight:650;color:var(--navy);text-decoration:none;min-height:50px}
  .module-grid a .ico{color:#2E64B5}
  .side-col,.bottom{grid-template-columns:1fr}
  .side-col .auctions{grid-column:auto}
  .form-grid,.split{grid-template-columns:1fr}
  .ai-modal{padding:0;align-items:stretch}
  .ai-box{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr);border-radius:0;max-height:none;height:100%}
  .ai-visual{flex-direction:row;padding:14px 16px;gap:14px;text-align:left;justify-content:flex-start}
  .ai-face{width:76px;height:76px;flex-shrink:0}
  .ai-visual .wave{display:none}
  .ai-chat{min-height:0;max-height:none;padding:12px 14px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}

/* =====================================================================
   v0.6 — Início em formato de anel de vidro (referência aprovada pelo
   usuário), adaptado ao azul institucional da Topo.
   ===================================================================== */
.scrim{position:fixed;inset:0;background:rgba(7,18,41,.45);z-index:15}
.home-brand,.ai-pill{display:none}
body.is-home .app{grid-template-columns:minmax(0,1fr);background:
  radial-gradient(ellipse 60% 50% at 0% 0%,#DCE7F7 0%,transparent 70%),
  radial-gradient(ellipse 50% 60% at 100% 100%,#DDE8F8 0%,transparent 70%),
  linear-gradient(135deg,#F8FAFE 0%,#EEF3FA 55%,#E8EFF9 100%)}
/* Menu completo vira gaveta no Início, em qualquer tamanho de tela */
body.is-home .side{position:fixed;inset:0 auto 0 0;width:280px;height:100%;transform:translateX(-105%);visibility:hidden;transition:transform .22s ease}
body.is-home .side.open{transform:none;visibility:visible;box-shadow:20px 0 60px rgba(0,0,0,.3)}
body.is-home .brand{display:block;padding:0 14px}
body.is-home .brand img{width:140px;height:auto;object-fit:contain}
body.is-home .brand small,body.is-home .nav a span,body.is-home .side-foot{display:block}
body.is-home .nav a{justify-content:flex-start;padding:11px 14px}
body.is-home .menu-btn{display:grid;background:rgba(255,255,255,.7);border-color:#D9E4F3}
body.is-home .search,body.is-home .mobile-logo,body.is-home .profile div{display:none}
body.is-home .main{padding:22px 34px 36px}
body.is-home .topbar{align-items:flex-start;margin-bottom:0}
body.is-home .home-brand{display:block;margin-right:auto}
.home-brand img{width:150px;height:auto;display:block}
.home-brand p{margin:10px 0 0;font-size:15px;color:#4E6488;letter-spacing:.02em}
.home-brand i{display:block;width:44px;height:2px;background:var(--blue);margin-top:14px;border-radius:2px}
body.is-home .ai-pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:20px;border:1px solid #D2DEEF;background:rgba(255,255,255,.7);font-size:12px;font-weight:600;color:var(--ink-2)}
.ai-pill i{width:8px;height:8px;border-radius:50%;background:#9AA9C2}
.ai-pill.on i{background:#1DB98A;box-shadow:0 0 8px #1DB98A}
body.is-home .icon-btn#notifBtn,body.is-home .avatar{background:rgba(255,255,255,.7);border:1px solid #D2DEEF;color:var(--navy);width:40px;height:40px;border-radius:50%}

/* Anel */
.home{grid-template-columns:minmax(0,1fr);grid-template-areas:"hero" "side" "bottom"}
.hero{position:relative;min-height:calc(100vh - 110px);padding:0 0 20px}
:root{--orb:150px}
.ring-stage{width:min(100%,900px,calc(100vh - 80px));padding:calc(var(--orb) / 2 + 4px)}

  background:radial-gradient(circle at 32% 22%,#FFFFFF 0%,#F4F8FD 45%,#E6EEF9 100%);border:1px solid rgba(255,255,255,.95);

.ai-avatar::after{content:"";position:absolute;right:2px;bottom:2px;width:12px;height:12px;border-radius:50%;background:#1DB98A;border:2px solid #fff}
.core-logo{width:58%;max-width:250px;height:auto}
.core-tag{margin:0;text-align:center;font-size:clamp(9px,.8vw,11px);font-weight:600;letter-spacing:.32em;line-height:1.9;color:#4E6488;text-transform:uppercase}
.ask{display:flex;align-items:center;gap:6px;width:100%;max-width:360px;background:#fff;border-radius:30px;padding:5px 5px 5px 18px;box-shadow:0 8px 24px rgba(15,24,55,.10),0 0 0 1px #E3EBF6}
.ask input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:13px;color:var(--ink)}
.ask button{width:40px;height:40px;border-radius:50%;border:0;display:grid;place-items:center;flex-shrink:0}
.ask .ask-mic{background:#F1F5FB;color:var(--navy)}
.ask .ask-send{background:linear-gradient(140deg,#598DDC,#2F63BE);color:#fff;box-shadow:0 4px 12px rgba(47,99,190,.4)}
.ask .ico{width:18px;height:18px}

/* Módulos em vidro */
.orb{gap:8px;border:1px solid rgba(255,255,255,.95);color:var(--navy);
  background:radial-gradient(circle at 30% 18%,#FFFFFF 0%,#F5F8FD 52%,#E5ECF7 100%);
  box-shadow:0 18px 40px rgba(15,24,55,.11),0 2px 6px rgba(15,24,55,.06),inset 0 -8px 20px rgba(89,141,220,.07),inset 0 2px 6px #fff}
.orb:hover{transform:translate(-50%,-50%) scale(1.05);box-shadow:0 22px 46px rgba(15,24,55,.16),0 0 0 2px rgba(89,141,220,.35),inset 0 2px 6px #fff}
.orb .ico{width:36px;height:36px;color:var(--navy);stroke-width:1.35}
.orb b{font-size:14px;font-weight:600;letter-spacing:.01em;text-align:center;line-height:1.25;padding:0 10px}
.orb::after{content:"";width:28px;height:2px;border-radius:2px;background:#B7C9E6;margin-top:4px}
.orb .soon{font-size:9px;font-weight:600;letter-spacing:.14em;color:#6C7FA0;text-transform:uppercase;margin-top:-4px}
.orb .num{top:2px;right:6px;width:30px;height:30px;background:#fff;border:1px solid #E1E9F5;color:var(--navy);font-size:12px;box-shadow:0 4px 12px rgba(15,24,55,.12)}
.orb.primary{color:var(--navy);border:1px solid #fff;background:radial-gradient(circle at 30% 18%,#FFFFFF 0%,#F2F7FF 55%,#E1ECFB 100%);
  box-shadow:0 0 0 2px rgba(255,255,255,.9),0 0 0 5px rgba(89,141,220,.28),0 0 46px rgba(89,141,220,.55),0 18px 40px rgba(15,24,55,.10)}
.orb.primary .ico{color:var(--navy)}
.orb.primary::after{background:var(--blue)}
.orb.primary .num{background:var(--blue);border-color:var(--blue);color:#fff}
.hero-foot{position:absolute;left:0;bottom:24px;font-size:11px;line-height:1.7;color:#5D7193;letter-spacing:.04em}
.hero-foot b{display:block;letter-spacing:.2em;font-weight:600;color:var(--navy)}
.hero-foot i{display:block;width:38px;height:2px;background:var(--blue);margin-top:12px}
.side-col{grid-template-columns:repeat(3,minmax(0,1fr))}
.side-col .auctions{grid-column:auto}
body.is-home .panel{background:rgba(255,255,255,.78);backdrop-filter:blur(6px)}

@media (max-width:1280px){ :root{--orb:132px} }
@media (max-width:1180px){
  :root{--orb:118px}
  .hero{min-height:0;padding-top:20px}
  .ring-stage{width:min(100%,700px)}
  .hero-foot{display:none}
  .side-col{grid-template-columns:repeat(2,minmax(0,1fr))}
  .side-col .auctions{grid-column:1/-1}
  .orb b{font-size:12px}
  .orb .ico{width:30px;height:30px}
}
@media (max-width:760px){
  body.is-home .main{padding:14px 14px 30px}
  .home-brand img{width:112px}
  .home-brand p{font-size:13px;margin-top:6px}
  .home-brand i{margin-top:10px}
  body.is-home .ai-pill{display:none}
  .hero{padding-top:14px}
  .ring{width:min(88vw,340px);border:0}
  .core{position:relative;inset:auto;width:100%;height:100%;padding:0 10%}
  .core-tag{letter-spacing:.24em}
  .side-col{grid-template-columns:1fr}
  .side-col .auctions{grid-column:auto}
  .module-grid a{background:radial-gradient(circle at 20% 10%,#fff,#F1F5FC);border:1px solid #fff;border-radius:16px;box-shadow:0 8px 20px rgba(15,24,55,.08);flex-wrap:wrap;row-gap:0}
  .module-grid a small{flex-basis:100%;padding-left:30px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#6C7FA0;font-weight:600}
}
@media (max-width:760px){ .ask{padding-left:14px} .ask button{width:36px;height:36px} }

/* ---------- v0.7 — automações, comercial, marketing ---------- */
.auto-strip{display:flex;align-items:center;gap:12px;background:linear-gradient(110deg,#EAF2FE,#F6F9FE);border:1px solid #D3E2F7;border-radius:var(--radius-m);padding:12px 14px;margin-bottom:16px}
.stack>.auto-strip{margin-bottom:0}
.auto-strip>.ico{color:var(--blue-strong)}
.auto-strip>div{flex:1;min-width:0;display:grid;gap:2px}
.auto-strip b{font-size:13px}
.auto-strip small{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.funnel{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.funnel-step{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 8px;display:grid;gap:4px;text-align:center}
.funnel-step strong{font-size:22px;font-weight:800}
.funnel-step span{font-size:11px;color:var(--ink-2);font-weight:600}
.funnel-step[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.funnel-step[aria-pressed="true"] span{color:#C9D7F0}
.auto-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:13px 0;border-top:1px solid #EEF2F8}
.auto-row:first-of-type{border-top:0}
.auto-row .list-main{flex:1 1 260px}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;word-break:break-all}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:650;color:var(--ink-2);cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--blue-strong)}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.check{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:12px;font-weight:600;cursor:pointer;background:#fff}
.check input{accent-color:var(--blue-strong)}
.ev{border-top:1px solid #EEF2F8;padding:10px 0}
.ev:first-of-type{border-top:0}
.ev summary{display:flex;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer;font-size:12px;list-style:none}
.ev summary::-webkit-details-marker{display:none}
.ev-txt{flex:1;min-width:160px;font-weight:600}
.ev summary small{color:var(--ink-3)}
.ev pre{background:#0F1837;color:#CFE0FF;border-radius:10px;padding:12px;font-size:11px;overflow-x:auto;margin:10px 0 6px}
.ev-ent{display:block;font-size:11px;color:var(--ink-2)}
@media (max-width:760px){ .funnel{grid-template-columns:repeat(3,minmax(0,1fr))} .auto-strip{flex-wrap:wrap} .auto-strip .btn{width:100%;justify-content:center} }

/* ---------- v0.8 — Processos ---------- */
.proc-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;border-top:1px solid #EEF2F8;background:none;padding:13px 0;color:var(--ink);flex-wrap:wrap}
.proc-row:first-of-type{border-top:0}
.proc-row .list-main{flex:1 1 220px}
.proc-row:hover b{color:var(--blue-strong)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kv div{background:#F4F8FE;border-radius:10px;padding:10px 12px;display:grid;gap:3px;min-width:0}
.kv small{font-size:11px;color:var(--ink-3)}
.kv b{font-size:13px;overflow-wrap:anywhere}
.timeline{display:grid}
.tl{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;position:relative;padding-bottom:16px}
.tl::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.tl:last-child::before{display:none}
.tl i{width:14px;height:14px;border-radius:50%;background:#fff;border:3px solid var(--blue);margin-top:2px}
.tl:first-child i{background:var(--blue)}
.tl small{font-size:11px;color:var(--ink-3)}
.tl p{margin:3px 0 0;font-size:13px;line-height:1.55}
textarea.input{resize:vertical;font-size:12px;line-height:1.5}
@media (max-width:760px){ .kv{grid-template-columns:1fr 1fr} }

/* ---------- v0.11 — leilão clicável ---------- */
.name-link{border:0;background:none;padding:0;font-weight:700;color:var(--ink);text-align:left;font-size:13px;line-height:1.45}
.name-link:hover{color:var(--blue-strong);text-decoration:underline}
.clickable{cursor:pointer;border-radius:10px;transition:background .15s}
.clickable:hover{background:var(--blue-soft)}
.list-row.clickable{padding-left:6px;padding-right:6px;margin:0 -6px}
.card p.mono{font-size:12px}

/* ---------- v0.12 — contas a receber ---------- */
.extrato{border-top:1px solid var(--line);margin-top:16px}
.ex-list{display:grid;gap:2px;margin-top:6px}
.ex-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid #EEF2F8;flex-wrap:wrap}
.ex-row .list-main{flex:1 1 220px}
@media (max-width:760px){ #receber .kpis{grid-template-columns:1fr!important} }

/* ---------- v0.13 — mais vida no Início ---------- */
@keyframes orbIn{from{opacity:0;scale:.6}to{opacity:1;scale:1}}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -6px}}
.orb{animation:orbIn .6s cubic-bezier(.2,.9,.3,1.3) both, float 6s ease-in-out infinite;animation-delay:calc(var(--i) * 70ms), calc(var(--i) * -0.6s + .7s)}
.orb .ico{transition:transform .25s ease}
.orb:hover .ico{transform:translateY(-3px) scale(1.08)}

@keyframes ping{0%{opacity:.8;transform:scale(.92)}80%,100%{opacity:0;transform:scale(1.18)}}
.orbit{position:absolute;inset:-1px;border-radius:50%;animation:spin 28s linear infinite;pointer-events:none}
.orbit i{position:absolute;top:-4px;left:50%;width:8px;height:8px;margin-left:-4px;border-radius:50%;background:var(--blue);box-shadow:0 0 12px 3px rgba(89,141,220,.7)}
.orbit-2{inset:14%;animation-duration:18s;animation-direction:reverse}
.orbit-2 i{width:6px;height:6px;background:#8FB6F0;box-shadow:0 0 10px 2px rgba(143,182,240,.7)}
.orbit-2::before{content:"";position:absolute;inset:0;border-radius:50%;border:1px dashed rgba(89,141,220,.22)}
.core-aura{position:absolute;inset:16%;border-radius:50%;background:conic-gradient(from 0deg,rgba(89,141,220,.0),rgba(89,141,220,.45),rgba(120,200,255,.15),rgba(89,141,220,.0),rgba(59,118,214,.4),rgba(89,141,220,.0));filter:blur(22px);animation:spin 14s linear infinite;pointer-events:none}
.core{animation:coreIn .7s ease both}
@keyframes coreIn{from{opacity:0;scale:.9}to{opacity:1;scale:1}}
.core-logo{animation:fadeUp .6s .25s ease both}
.core-tag{animation:fadeUp .6s .35s ease both}
.ask{animation:fadeUp .6s .45s ease both;transition:box-shadow .2s, transform .2s}
.ask:focus-within{box-shadow:0 10px 30px rgba(47,99,190,.25),0 0 0 2px var(--blue);transform:translateY(-1px)}
.ask .ask-send:hover{transform:rotate(-12deg) scale(1.06)}
.ask button{transition:transform .2s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ai-avatar::before{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(29,185,138,.5);animation:ping 2.2s ease-out infinite}
.home-brand{animation:fadeUp .6s ease both}
.live-strip{grid-column:1/-1;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.75);border:1px solid #DCE6F4;border-radius:40px;padding:8px 8px 8px 10px;overflow:hidden;backdrop-filter:blur(6px);margin-top:-6px}
.live-badge{display:inline-flex;align-items:center;gap:7px;flex-shrink:0;background:var(--navy);color:#fff;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}

@keyframes blink{50%{opacity:.25}}
.marquee{flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.marquee-track{display:inline-flex;gap:38px;white-space:nowrap;animation:marquee 48s linear infinite;font-size:12.5px;color:var(--ink-2)}
.marquee-track span::before{content:"◆";color:var(--blue);font-size:8px;margin-right:12px;vertical-align:2px}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .55s ease var(--d,0ms), transform .55s ease var(--d,0ms), box-shadow .2s}
.reveal.in{opacity:1;transform:none}
body.is-home .panel:hover{box-shadow:0 16px 40px rgba(15,24,55,.10);transform:translateY(-2px)}
.kpi{transition:transform .2s, background .2s}
.kpi:hover{transform:translateY(-2px);background:#E9F1FD}
.bar{transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.bar-col:nth-child(2) .bar{animation-delay:.08s}.bar-col:nth-child(3) .bar{animation-delay:.16s}.bar-col:nth-child(4) .bar{animation-delay:.24s}.bar-col:nth-child(5) .bar{animation-delay:.32s}.bar-col:nth-child(6) .bar{animation-delay:.4s}

.list-row.clickable:hover .list-icon{background:var(--blue);color:#fff}
.list-icon{transition:background .2s,color .2s}
.module-grid a{transition:transform .2s, box-shadow .2s;animation:fadeUp .5s both}

/* =====================================================================
   v0.14 — A cara da Topo: azul institucional #0F1837, destaque #598DDC,
   Montserrat pesada e a inclinação do logotipo como assinatura gráfica.
   ===================================================================== */
:root{--slant:-12deg;--brand:#0F1837;--accent:#598DDC}
/* Títulos com o peso e a inclinação do logotipo */

.panel h2::before{content:"";width:5px;height:16px;background:var(--accent);transform:skewX(var(--slant));border-radius:1px;flex-shrink:0}

.orb.primary .num{background:var(--accent);border-color:var(--accent)}
.orb::after{width:30px;height:4px;background:#C4D4EC;transform:skewX(var(--slant));border-radius:1px}

.live-badge>*,.live-badge{font-style:italic}
.btn-primary{background:var(--brand);font-weight:700}

.ask .ask-send{background:linear-gradient(140deg,#1D3A7A,var(--brand));box-shadow:0 4px 12px rgba(15,24,55,.35)}

.nav a{position:relative}
.demo-tag{border-radius:3px}
/* Tablet e celular */

}

:root[data-theme="dark"] .orb,:root[data-theme="dark"] .orb.primary{background:radial-gradient(circle at 30% 18%,#25407A 0%,#182F60 55%,#12244C 100%);border-color:rgba(120,165,235,.35);color:var(--ink)}
:root[data-theme="dark"] .orb .ico,:root[data-theme="dark"] .orb.primary .ico{color:#BFD6FF}
:root[data-theme="dark"] .orb.primary{box-shadow:0 0 0 2px rgba(120,165,235,.5),0 0 46px rgba(89,141,220,.6)}
:root[data-theme="dark"] .orb.primary .num{background:#598DDC;border-color:#598DDC;color:#fff}
:root[data-theme="dark"] .orb .num{background:#1A2D57;border-color:#2E4C86;color:#E6EEFB}
:root[data-theme="dark"] .orb .soon{color:#8DA2C4}
:root[data-theme="dark"] body.is-home .panel{background:rgba(17,29,61,.85)}
:root[data-theme="dark"] body.is-home .ai-pill,:root[data-theme="dark"] body.is-home .menu-btn,:root[data-theme="dark"] body.is-home .avatar,:root[data-theme="dark"] body.is-home .icon-btn#notifBtn{background:rgba(17,29,61,.8);border-color:#2A4378;color:var(--ink)}
:root[data-theme="dark"] .module-grid a{background:radial-gradient(circle at 20% 10%,#1E3466,#132650);border-color:#2A4378}
:root[data-theme="dark"] .auto-strip{background:linear-gradient(110deg,#14284F,#111D3D);border-color:#2A4378}
:root[data-theme="dark"] .funnel-step,:root[data-theme="dark"] .check{background:var(--surface);border-color:var(--line);color:var(--ink)}
:root[data-theme="dark"] .funnel-step[aria-pressed="true"]{background:#598DDC;border-color:#598DDC;color:#fff}
:root[data-theme="dark"] .ev,:root[data-theme="dark"] .auto-row,:root[data-theme="dark"] .proc-row,:root[data-theme="dark"] .ex-row,:root[data-theme="dark"] .extrato{border-color:var(--line)}
:root[data-theme="dark"] .kv div{background:#16264D}
:root[data-theme="dark"] .tl i{background:var(--surface)}
:root[data-theme="dark"] .tl:first-child i{background:#598DDC}
:root[data-theme="dark"] .proc-row{color:var(--ink)}
:root[data-theme="dark"] .name-link{color:var(--ink)}
:root[data-theme="dark"] .live-strip{background:rgba(17,29,61,.8);border-color:#2A4378}
:root[data-theme="dark"] .page-head h1,:root[data-theme="dark"] .home-brand p strong,:root[data-theme="dark"] .kpi strong,:root[data-theme="dark"] .card .big{color:#fff}
:root[data-theme="dark"] .bs1{background:linear-gradient(160deg,#1B3470,#25448A)}
:root[data-theme="dark"] .bs3{background:linear-gradient(20deg,#13254D,#0F1F44)}
:root[data-theme="dark"] .btn-primary,:root[data-theme="dark"] .tab[aria-pressed="true"],:root[data-theme="dark"] .funnel-step[aria-pressed="true"]{background:#598DDC;border-color:#598DDC}

:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.ai-modal{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}}


/* ---------- v0.17 — login e nuvem ---------- */
.nuvem-tela{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:16px;background:linear-gradient(170deg,#0F1837 0%,#11295A 55%,#0F1837 100%);overflow-y:auto}
.nuvem-tela[hidden]{display:none}
.nuvem-caixa{width:100%;max-width:400px;background:var(--surface);border-radius:var(--radius-l);padding:28px 24px;box-shadow:var(--shadow)}
.nuvem-logo{display:block;width:150px;max-width:60%;height:auto;margin:0 auto 18px}
.nuvem-caixa h1{font-size:20px;margin:0 0 4px;text-align:center}
.nuvem-sub{color:var(--ink-2);text-align:center;margin:0 0 18px}
.nuvem-form{display:grid;gap:12px}
.nuvem-form .btn{width:100%;min-height:44px;justify-content:center;text-align:center}
.nuvem-msg{min-height:1.2em;margin:4px 0 0;color:var(--danger);font-weight:600}
#acessosPanel .nuvem-msg,#importPanel .nuvem-msg{color:var(--ink)}
.nuvem-aviso{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:900;max-width:min(560px,calc(100% - 32px));background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow)}
.nuvem-aviso[hidden]{display:none}
.nuvem-status[data-tipo=erro]{color:#FF9C96;font-weight:700}
.profile .nuvem-status[data-tipo=erro]{color:var(--danger)}
.nuvem-conta{display:grid;gap:2px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(255,255,255,.12)}
.nuvem-conta b{color:#fff;font-size:13px}
.nuvem-conta small{display:block;color:#A9C3EE}
.nuvem-sair-lateral{margin-top:8px;justify-self:start;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);min-height:38px;padding:6px 14px}
.nuvem-sair{margin-left:8px;min-height:36px;padding:6px 12px}
</style>

function categoriaPorTitulo(t){
  const s = t.toLowerCase();
  if (/benefic/.test(s)) return 'Beneficente';
  if (/fração ideal/.test(s)) return 'Fração ideal';
  if (/^direitos|cotas patrimoniais/.test(s)) return 'Direitos sobre imóvel';
  if (/honda|volkswagen|jetta|biz|veículo|carro|moto/.test(s)) return 'Veículo';
  if (/máquina|motoredutor|empilhadeira|varredeira|industrial|sucata/.test(s)) return 'Máquina industrial';
  if (/refrigerador|lavadora|eletroport|camisa/.test(s)) return 'Bens móveis';
  if (/apartamento|sobrado|casa|imóvel|terreno|vaga de garagem|área de lazer/.test(s)) return 'Imóvel';
  return 'Outros';
}

function mesclarSite(db){

      fin:{etapa:'prevista',arrematado:0,nota:'',recebidoEm:'',evidencia:'',hist:[]}});
    if (!db.lotes.some(o=>o.id===loteId)) db.lotes.push({id:loteId,leilao:id,descricao:loteNome||nome,categoria:categoriaPorTitulo(loteNome||nome),status:statusLote,valor:0,link:`${S}lote/${loteId}/${loteSlug}`,origem:'site'});
  });
  add(SITE_ATIVOS,'Publicado','Publicado');
  add(SITE_ENCERRADOS,'Encerrado','Encerrado');
  db.siteLeitura = SITE_LEITURA;
  return db;
}

function comissao(l){
  const base = l.fin.etapa==='prevista' ? Number(l.valor)||0 : Number(l.fin.arrematado)||0;
  return Math.round(base * (Number(l.comissaoPct)||0) / 100);

function resumoFinanceiro(filtro){
  const zero = ()=>({prevista:0,gerada:0,faturada:0,recebida:0,emAberto:0,leiloes:0});
  const tot = zero(), porFonte = {}, porLeiloeiro = {};
  [...MODALIDADES,'Sem modalidade'].forEach(m=>porFonte[m]=zero());
  DB.leiloes.filter(l=>!filtro||l.modalidade===filtro).forEach(l=>{
    const v = comissao(l), e = l.fin.etapa;
    const fonte = l.modalidade||'Sem modalidade';
    porLeiloeiro[l.responsavel] ||= zero();
    for (const g of [tot, porFonte[fonte], porLeiloeiro[l.responsavel]]){
      g[e] += v; g.leiloes++;
      if (e==='gerada'||e==='faturada') g.emAberto += v;
    }
  });
  if (!porFonte['Sem modalidade'].leiloes) delete porFonte['Sem modalidade'];
  const desp = DB.despesas.filter(d=>!filtro||leilaoById(d.leilao)?.modalidade===filtro);
  return {tot, porFonte, porLeiloeiro,
    despesas:{total:desp.reduce((a,d)=>a+d.valor,0), aReembolsar:desp.filter(d=>d.status==='A reembolsar').reduce((a,d)=>a+d.valor,0)}};
}

function cnjValido(n){
  const m = String(n).trim().match(/^(\d{7})-(\d{2})\.(\d{4})\.(\d)\.(\d{2})\.(\d{4})$/);
  if (!m) return false;
  const r = Number(BigInt(m[1]+m[3]+m[4]+m[5]+m[6]+'00') % 97n);
  return 98 - r === Number(m[2]);
}

// Lê um histórico colado do portal do tribunal: cada linha que começa com data vira um andamento.
function lerHistorico(texto){
  const out = []; let atual = null;
  for (const raw of String(texto).split(/\r?\n/)){
    const linha = raw.trim(); if (!linha) continue;
    const m = linha.match(/^(\d{2})\/(\d{2})\/(\d{4})(?:\s*(?:às|-)?\s*(\d{2}:\d{2})(?::\d{2})?)?\s*[-–:|]?\s*(.*)$/);
    if (m){ atual = {em:`${m[3]}-${m[2]}-${m[1]}`, hora:m[4]||'', texto:m[5]||'', origem:'histórico colado'}; out.push(atual); }
    else if (atual) atual.texto = (atual.texto ? atual.texto+' ' : '') + linha;
  }
  return out.filter(a=>a.texto);
}

// Registra o evento e entrega para as automações ativas inscritas nele.
function emit(tipo, dados, resumo){
  const ev = {id:'ev_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), tipo, modulo:EVENTOS[tipo]?.[0]||'', em:nowISO(), resumo, dados, entregas:[]};
  DB.eventos.unshift(ev); DB.eventos = DB.eventos.slice(0,200); saveDB();
  const alvos = DB.automacoes.filter(a=>a.ativa && a.eventos.includes(tipo));
  alvos.forEach(async a=>{
    const r = await entregar(a, ev);
    ev.entregas.push(r); a.ultima = {em:nowISO(), status:r.status}; saveDB();
    if (App.route==='integracoes') RENDER.integracoes();
  });
  return ev;
}

function autoStrip(modulo){
  const n = autosDoModulo(modulo), ativas = n.filter(a=>a.ativa).length;
  const evs = Object.entries(EVENTOS).filter(([,v])=>v[0]===modulo).map(([,v])=>v[1]);

const CONTAS_PADRAO = [
  {id:'guilherme', titular:'Guilherme', apelido:'Conta Guilherme', banco:''},
  {id:'fernanda',  titular:'Fernanda',  apelido:'Conta Fernanda',  banco:''},

const situacaoTitulo = t => t.status==='Recebido' ? 'Recebido' : (t.vencimento && t.vencimento < today() ? 'Vencido' : 'Em aberto');

function initReceber(db){
  db.contas ||= structuredClone(CONTAS_PADRAO);
  db.receber ||= [];
  db.extratos ||= [];
  if (!db.receberInit){
    // Gera os títulos que já deveriam existir para o que foi registrado antes desta versão.
    db.leiloes.forEach(l=>{
      if (!l.fin || l.fin.etapa==='prevista') return;
      const base = l.fin.etapa==='prevista' ? 0 : Number(l.fin.arrematado)||0;
      const valor = Math.round(base*(Number(l.comissaoPct)||0)/100);
      const dataArr = l.fin.hist.find(h=>/Arremata|Venda/.test(h.txt))?.em || today();
      db.receber.push({id:db.receber.length+1,leilao:l.id,conta:contaDoResponsavel(l.responsavel),tipo:'Comissão',pagador:'Arrematante',descricao:`Comissão do leilão #${l.id}`,valor,vencimento:dataArr,
        status:l.fin.etapa==='recebida'?'Recebido':'Em aberto',recebidoEm:l.fin.recebidoEm||'',evidencia:l.fin.evidencia||'',origem:'automático'});
    });
    db.despesas.filter(d=>d.reembolsavel).forEach(d=>{
      const l = db.leiloes.find(x=>x.id===d.leilao);
      db.receber.push({id:db.receber.length+1,leilao:d.leilao,conta:contaDoResponsavel(l?.responsavel),tipo:'Reembolso de despesa',pagador:'Comitente',descricao:d.descricao,valor:d.valor,vencimento:'',
        status:d.status==='Reembolsada'?'Recebido':'Em aberto',recebidoEm:'',evidencia:'',origem:'automático',despesa:d.id});
    });
    db.receberInit = true;
  }
  return db;
}

function criarTitulo(t){
  const item = {id:nextId(DB.receber), status:'Em aberto', recebidoEm:'', evidencia:'', origem:'manual', ...t};
  DB.receber.push(item); saveDB();
  emit('financeiro.titulo_criado', item, `Título a receber: ${item.descricao} (${brl(item.valor)}) na ${contaById(item.conta)?.apelido||'conta a definir'}`);
  return item;
}

// Baixa um título e mantém o resto do sistema coerente (etapa da comissão, despesa reembolsada).
function baixarTitulo(t, data, evidencia, ref){
  t.status = 'Recebido'; t.recebidoEm = data; t.evidencia = evidencia; if (ref) t.extratoRef = ref;
  const l = leilaoById(t.leilao);
  if (t.tipo==='Comissão' && l && l.fin.etapa!=='recebida'){
    l.fin.etapa = 'recebida'; l.fin.recebidoEm = data; l.fin.evidencia = evidencia;
    l.fin.hist.push({em:data, txt:`Recebimento conciliado na ${contaById(t.conta)?.apelido||'conta'} (${evidencia})`});
  }
  if (t.despesa){ const d = DB.despesas.find(x=>x.id===t.despesa); if (d) d.status = 'Reembolsada'; }
  saveDB();
  emit('financeiro.recebimento', {titulo:t.id, leilao:t.leilao, conta:t.conta, valor:t.valor, data, evidencia}, `Recebido ${brl(t.valor)} na ${contaById(t.conta)?.apelido||'conta'}: ${t.descricao}`);
}

// ---------- Extrato: OFX ou CSV (data; descrição; valor) ----------
function lerExtrato(texto){
  const out = [];
  if (/<STMTTRN>/i.test(texto)){
    texto.split(/<STMTTRN>/i).slice(1).forEach(b=>{
      const tag = n => (b.match(new RegExp(`<${n}>([^<\\r\\n]+)`,'i'))||[])[1]?.trim() || '';
      const v = Number(tag('TRNAMT').replace(',','.')); const d = tag('DTPOSTED');
      if (!isFinite(v) || d.length<8) return;
      out.push({data:`${d.slice(0,4)}-${d.slice(4,6)}-${d.slice(6,8)}`, valor:v, descricao:tag('MEMO')||tag('NAME')||'Lançamento', ref:tag('FITID')});
    });
    return out;
  }
  const linhas = texto.split(/\r?\n/).filter(x=>x.trim());
  const sep = (linhas[0]||'').split(';').length > (linhas[0]||'').split(',').length ? ';' : ',';
  linhas.forEach((ln,i)=>{
    const c = ln.split(sep).map(x=>x.replace(/^"|"$/g,'').trim());
    const dm = c.find(x=>/^\d{2}\/\d{2}\/\d{4}$/.test(x)||/^\d{4}-\d{2}-\d{2}$/.test(x)); if (!dm) return;
    const data = dm.includes('/') ? dm.split('/').reverse().join('-') : dm;
    const vs = c.filter(x=>x!==dm && /^-?R?\$?\s*-?[\d.]+,\d{2}$|^-?\d+(\.\d{1,2})?$/.test(x.replace(/\s/g,'')));
    if (!vs.length) return;
    const raw = vs[vs.length-1].replace(/R\$|\s/g,'');
    const valor = raw.includes(',') ? Number(raw.replace(/\./g,'').replace(',','.')) : Number(raw);
    const descricao = c.filter(x=>x!==dm && !vs.includes(x)).join(' ') || 'Lançamento';
    out.push({data, valor, descricao, ref:`csv-${data}-${valor}-${i}`});
  });
  return out;
}
// Sugere o título em aberto da mesma conta com o mesmo valor e data próxima.
function sugerirTitulo(lanc, conta){
  const dias = (a,b) => Math.abs((new Date(a)-new Date(b))/864e5);
  return DB.receber.filter(t=>t.conta===conta && t.status!=='Recebido' && Math.abs(t.valor-lanc.valor)<0.01)
    .sort((a,b)=>dias(a.vencimento||lanc.data,lanc.data)-dias(b.vencimento||lanc.data,lanc.data))[0] || null;
}

function resumoReceber(conta){
  const ts = DB.receber.filter(t=>!conta||t.conta===conta);
  const soma = f => ts.filter(f).reduce((a,t)=>a+(Number(t.valor)||0),0);
  const mes = today().slice(0,7);
  return {emAberto:soma(t=>situacaoTitulo(t)==='Em aberto'), vencido:soma(t=>situacaoTitulo(t)==='Vencido'), recebidoMes:soma(t=>t.status==='Recebido'&&(t.recebidoEm||'').startsWith(mes)), semConta:ts.filter(t=>!t.conta).length, total:ts.length};
}

function answer(q){
  const t = q.toLowerCase();
  const pend = DB.tarefas.filter(x=>!x.feito);
  const criar = t.match(/cri(?:e|ar|a)\s+(?:uma\s+)?tarefa\s*(?:para|de)?\s*(.+)/);
  if (criar && criar[1].trim()){
    const texto = criar[1].trim().replace(/[.?!]+$/,'');
    const num = texto.match(/\b(\d{4})\b/); const leilao = num && leilaoById(num[1]) ? Number(num[1]) : null;
    const task = {id:nextId(DB.tarefas),texto:texto.charAt(0).toUpperCase()+texto.slice(1),responsavel:'A definir',prazo:'',leilao,feito:false};
    DB.tarefas.push(task); saveDB(); emit('tarefa.criada',task,`Tarefa criada pela TOPO AI: ${task.texto}`); App.refresh();
    return {text:`Criei a tarefa “${task.texto}”. Ela aparece em Tarefas e no painel inicial.`, cards:[{icon:'check',title:task.texto,sub:'Responsável a definir',tag:'Pendente',href:'#tarefas'}]};
  }
  if (/aten[cç][aã]o|hoje|priorid/.test(t)){
    const prep = DB.leiloes.filter(l=>/Preparação|Captação|Análise/.test(l.status));
    return {text:`Agora há ${pend.length} ${pend.length===1?'tarefa pendente':'tarefas pendentes'} e ${prep.length} ${prep.length===1?'leilão ainda':'leilões ainda'} em preparação. Alertas automáticos de prazo dependem do servidor.`,

  }
  if (/guilherme|fernanda/.test(t)){
    const por = n => DB.leiloes.filter(l=>l.responsavel===n);
    return {text:`Separando os leilões por responsável: Guilherme tem ${por('Guilherme').length} e Fernanda tem ${por('Fernanda').length}. Leilões com responsável a definir não entram na conta.`,

      cards:DB.leiloes.slice(0,5).map(l=>({icon:'gavel',title:`#${l.id} ${l.nome}`,sub:`${l.cidade} · ${brl(l.valor)}`,tag:l.status,href:'#leiloes'}))};
  }
  if (/comiss|receb|receita|financ|judicial|privad/.test(t)){
    const f = /extrajudicial/.test(t)?'Extrajudicial':/judicial/.test(t)?'Judicial':/privad/.test(t)?'Privado':/venda direta/.test(t)?'Venda direta':'';
    const r = resumoFinanceiro(f).tot;
    return {text:`${f?'Nos leilões '+f.toLowerCase()+'s':'Somando todas as fontes'}, a comissão em aberto é ${brl(r.emAberto)} e a recebida é ${brl(r.recebida)}. A prevista, sem arrematação ainda, soma ${brl(r.prevista)}. Leilões sem valor ou sem % de comissão ainda não entram na soma.`, cards:[{icon:'wallet',title:'Abrir Financeiro',sub:f||'Todas as fontes',href:'#financeiro'}]};
  }
  if (/pagament|concilia|edita/.test(t)){
    return {text:'Ainda não há lançamentos financeiros, comissões ou editais reais conectados. O módulo Financeiro vai separar comissão prevista, gerada, recebida e em aberto depois que as definições forem aprovadas pelo financeiro.', cards:[{icon:'wallet',title:'Abrir Financeiro',sub:'Estrutura planejada',href:'#financeiro'}]};
  }
  if (/tarefa|pend|atras/.test(t)){
    return {text:`Há ${pend.length} tarefa(s) pendente(s).`, cards:pend.slice(0,5).map(x=>({icon:'check',title:x.texto,sub:`${x.responsavel} · ${fmtDate(x.prazo)}`,tag:'Pendente',href:'#tarefas'}))};
  }
  if (/usu[aá]ri|acesso|permiss|equipe|perfil/.test(t)){
    return {text:`Existem ${DB.usuarios.length} usuário(s) cadastrado(s). Cada pessoa entra com login próprio e o perfil define o que ela vê; os acessos ficam em Pessoas.`, cards:[{icon:'users',title:'Abrir Pessoas e acessos',href:'#pessoas'}]};
  }
  return {text:'Posso listar leilões e tarefas, criar uma tarefa (ex.: “crie uma tarefa para revisar o lote 2458”) ou explicar os módulos planejados. Para responder sobre a operação real, os sistemas da Topo precisam ser integrados.'};
}

const ERR_COPY = {
  not_granted:'Sem a sua autorização eu sigo no modo simples, por regras locais.',
  rate_limited:'Muitas perguntas em sequência. Espere alguns segundos e tente de novo.',
  refused:'Não posso ajudar com esse pedido. Tente perguntar de outro jeito.',
  session_expired:'A sessão expirou. Recarregue a página para continuar.',
  prompt_too_large:'A conversa ficou longa demais. Feche e abra a TOPO AI para recomeçar.',
};
const clean = t => t.replace(/\*\*(.+?)\*\*/g,'$1').replace(/^#+\s*/gm,'').replace(/^\s*[-*]\s+/gm,'');

async function sendAI(){
  const input = document.getElementById('aiText');
  const q = input.value.trim(); if (!q) return;
  input.value = '';
  stopSpeaking(); AI.ctl?.abort();
  addBubble(q,'user');
  if (!AI.llm){
    setAIState('processando');
    setTimeout(()=>{
      let r;
      try { r = answer(q); } catch(e){ setAIState('erro'); addBubble('Não consegui processar essa pergunta. Tente reformular.'); return; }
      addBubble(r.text); addCards(r.cards); speakAll(r.text);
    }, 650);
    return;
  }
  AI.turns.push({role:'user',content:q});
  const turns = AI.turns.slice(-16);
  if (turns[0].role!=='user') turns.shift();
  const msgs = turns.map((t,i)=>i===0?{role:'user',content:RULES+'\n\nMensagem do usuário: '+t.content}:t);
  const cards = [], ctl = new AbortController(); AI.ctl = ctl;
  setAIState('pensando');
  const bubble = addBubble('…'); bubble.classList.add('interim');
  AI.spoken = 0;
  try {
    const {text} = await AI.llm(msgs, {
      cache:false, modelTier:'quick', signal:ctl.signal, tools:aiTools(cards),
      onText:({text})=>{ bubble.classList.remove('interim'); bubble.textContent = clean(text); if (AI.state==='pensando') setAIState('respondendo'); speakProgress(clean(text)); document.getElementById('messages').scrollTop=1e9; },
    });
    const final = clean(text);
    bubble.textContent = final;
    AI.turns.push({role:'assistant',content:text});
    addCards(dedupe(cards));
    speakProgress(final, true);
  } catch(e){
    if (e.code==='cancelled'){ if (bubble.textContent==='…') bubble.remove(); setAIState('inativa'); return; }
    AI.turns.pop();
    if (e.text){ bubble.textContent = clean(e.text) + ' (resposta interrompida)'; } else bubble.remove();
    if (e.code==='not_granted' || e.code==='sampling_disabled' || e.code==='capability_disabled' || e.code==='capability_removed' || e.code==='not_declared'){
      AI.llm = null; updateAIPill(); addBubble(ERR_COPY.not_granted); const r = answer(q); addBubble(r.text); addCards(r.cards); speakAll(r.text); return;
    }
    setAIState('erro', ERR_COPY[e.code] || 'A conexão com a IA falhou. Tente enviar de novo.');
  } finally { if (AI.ctl===ctl) AI.ctl = null; }
}
function dedupe(cards){ const seen=new Set(); return cards.filter(c=>!seen.has(c.title)&&seen.add(c.title)).slice(0,6); }

// ---------- Voz: fala frase a frase enquanto a resposta chega ----------
const VOICE_KEY = 'topo-one-voz';
function ptVoices(){ return speechSynthesis.getVoices().filter(v=>/^pt/i.test(v.lang)); }
function pickVoice(){
  let saved = null; try { saved = localStorage.getItem(VOICE_KEY); } catch(e){}
  const vs = ptVoices();
  const chosen = saved && vs.find(v=>v.voiceURI===saved);
  if (chosen) return chosen;
  const score = v => (/pt-BR/i.test(v.lang)?4:0) + (/natural|neural|online|google|francisca|luciana|thalita|vitória|vitoria/i.test(v.name)?3:0) + (v.localService?0:1);
  return vs.sort((a,b)=>score(b)-score(a))[0];
}
function sayChunk(chunk){
  if (!chunk.trim()) return;
  const u = new SpeechSynthesisUtterance(chunk.trim());
  u.lang = 'pt-BR'; u.rate = 1.0; u.pitch = 0.94;
  const v = pickVoice(); if (v) u.voice = v;
  AI.speechQ++;
  u.onstart = ()=>setAIState('respondendo');
  u.onend = u.onerror = ()=>{ AI.speechQ = Math.max(0,AI.speechQ-1); if (!AI.speechQ && !AI.ctl) afterSpeech(); };
  speechSynthesis.speak(u);
}
function speakProgress(text, done=false){
  if (AI.muted || !('speechSynthesis' in window)){ if (done) { setAIState('respondendo'); setTimeout(afterSpeech, 700); } return; }
  const rest = text.slice(AI.spoken);
  const m = done ? [rest] : rest.match(/^[\s\S]*?[.!?…](?=\s)/);
  if (m && m[0].trim()){ AI.spoken += m[0].length; sayChunk(m[0]); if (!done) speakProgress(text); }
  else if (done && !AI.speechQ) afterSpeech();
}
function speakAll(text){ AI.spoken = 0; speakProgress(text, true); }
function afterSpeech(){
  if (AI.state!=='respondendo' && AI.state!=='processando' && AI.state!=='pensando') return;
  setAIState('inativa');
  // Conversa contínua: se a pergunta veio por voz, volta a ouvir sozinha.
  if (AI.voiceTurn && AI.continuous && document.getElementById('aiModal').classList.contains('open')) setTimeout(()=>{ if (AI.state==='inativa') listen(); }, 350);
}
function stopSpeaking(){ AI.speechQ = 0; if ('speechSynthesis' in window) speechSynthesis.cancel(); if (AI.state==='respondendo') setAIState('inativa'); }

function stopListening(){ try{ AI.rec?.stop(); }catch(e){} AI.rec = null; }
function listen(){
  if (AI.state==='ouvindo' || AI.state==='transcrevendo'){ AI.voiceTurn = false; stopListening(); return; }
  stopSpeaking();
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ setAIState('erro','Reconhecimento de voz não está disponível neste navegador. Use o campo de texto (Chrome e Edge têm suporte).'); return; }
  const rec = new SR(); AI.rec = rec;
  rec.lang = 'pt-BR'; rec.interimResults = true; rec.continuous = false;
  let interim = null, finalText = '';
  rec.onstart = ()=>setAIState('ouvindo');
  rec.onresult = e=>{
    let txt = ''; finalText = '';
    for (const r of e.results){ txt += r[0].transcript; if (r.isFinal) finalText += r[0].transcript; }
    setAIState('transcrevendo');
    if (!interim){ interim = addBubble(txt,'user'); interim.classList.add('interim'); } else interim.textContent = txt;
  };
  rec.onerror = e=>{
    interim?.remove(); interim = null;
    if (e.error==='not-allowed' || e.error==='service-not-allowed') setAIState('microfone_negado');
    else if (e.error==='no-speech'){ AI.voiceTurn = false; setAIState('inativa','Não ouvi nada. Toque no microfone para falar de novo.'); }
    else if (e.error!=='aborted') setAIState('erro',`Falha no reconhecimento de voz (${e.error}). Use o campo de texto.`);
  };
  rec.onend = ()=>{
    AI.rec = null;
    if (interim){ interim.remove(); interim = null; }
    if (finalText.trim()){ AI.voiceTurn = true; document.getElementById('aiText').value = finalText.trim(); sendAI(); }
    else if (AI.state==='ouvindo' || AI.state==='transcrevendo') setAIState('inativa');
  };
  try { rec.start(); } catch(e){ setAIState('erro'); }
}

async function connectLLM(){
  if (!window.claude?.use) return;
  try { AI.llm = await window.claude.use('sample'); } catch(e){ AI.llm = null; }
  if (AI.llm && AI.state==='inativa') setAIState('inativa');
  updateAIPill();
}
function updateAIPill(){
  const p = document.getElementById('aiPill'); if (!p) return;
  p.classList.toggle('on', !!AI.llm);
  p.querySelector('span').textContent = AI.llm ? 'IA conectada' : 'Modo simples';
}
function fillVoices(){
  const sel = document.getElementById('voiceSel');
  if (!('speechSynthesis' in window)){ sel.innerHTML = '<option>Sem voz neste navegador</option>'; sel.disabled = true; document.getElementById('voiceTest').disabled = true; return; }
  const vs = ptVoices(), cur = pickVoice();
  sel.innerHTML = vs.length ? vs.map(v=>`<option value="${esc(v.voiceURI)}" ${cur&&v.voiceURI===cur.voiceURI?'selected':''}>${esc(v.name.replace(/^(Microsoft|Google)\s*/,''))} · ${esc(v.lang)}${v.localService?'':' · online'}</option>`).join('') : '<option>Nenhuma voz em português no aparelho</option>';
  sel.disabled = !vs.length;
}
function initAI(){
  connectLLM();
  if ('speechSynthesis' in window){ fillVoices(); speechSynthesis.onvoiceschanged = fillVoices; } else fillVoices();
  document.getElementById('voiceSel').onchange = e=>{ try { localStorage.setItem(VOICE_KEY, e.target.value); } catch(err){} };
  document.getElementById('voiceTest').onclick = ()=>{ if (AI.muted) return; stopSpeaking(); AI.voiceTurn = false; sayChunk('Oi, eu sou a TOPO AI. Já separei o que precisa da sua atenção hoje.'); };
  document.getElementById('aiWave').innerHTML = Array.from({length:16},(_,i)=>`<span style="--i:${i}"></span>`).join('');
  const typed = ()=>{ AI.voiceTurn = false; sendAI(); };
  document.getElementById('aiSend').onclick = typed;
  document.getElementById('aiText').addEventListener('keydown', e=>{ if (e.key==='Enter') typed(); });
  document.getElementById('aiMic').onclick = listen;
  document.getElementById('aiStop').onclick = ()=>{ AI.voiceTurn = false; AI.ctl?.abort(); stopSpeaking(); stopListening(); };
  document.getElementById('aiClose').onclick = closeAI;
  const mute = document.getElementById('aiMute');
  mute.onclick = ()=>{
    AI.muted = !AI.muted; mute.setAttribute('aria-pressed', AI.muted);
    mute.innerHTML = icon(AI.muted ? 'mute' : 'volume');
    if (AI.muted) stopSpeaking();
  };
  document.getElementById('aiModal').addEventListener('click', e=>{ if (e.target.id==='aiModal') closeAI(); });
  document.addEventListener('keydown', e=>{ if (e.key==='Escape' && document.getElementById('aiModal').classList.contains('open')) closeAI(); });
}

function tickerItens(){
  const ativos = DB.leiloes.filter(l=>l.origem==='site'&&!/Encerrado/.test(l.status));
  const r = resumoReceber('');
  const itens = [
    `<b>${ativos.length}</b> leilões ativos no site`,
    ...ativos.sort((a,b)=>b.id-a.id).slice(0,4).map(l=>`Em leilão: <b>${esc(l.nome.split(' - ')[0].slice(0,42))}</b> · ${esc(l.cidade)}`),
    `<b>${brl(r.emAberto+r.vencido)}</b> a receber nas contas dos leiloeiros`,
    ...DB.eventos.slice(0,3).map(e=>`${esc(e.resumo.slice(0,70))}`),
    `<b>${DB.tarefas.filter(t=>!t.feito).length}</b> tarefas pendentes`,
  ];
  return itens;
}
function animarInicio(){
  const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Contadores sobem até o valor.
  document.querySelectorAll('#body-inicio [data-count]').forEach(el=>{
    const alvo = Number(el.dataset.count); if (!isFinite(alvo) || reduz) return;
    const t0 = performance.now(), dur = 900;
    const passo = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = Math.round(alvo*e); if (k<1) requestAnimationFrame(passo); };
    requestAnimationFrame(passo);
  });
  // Painéis aparecem ao rolar.
  const io = 'IntersectionObserver' in window ? new IntersectionObserver(es=>es.forEach(en=>{ if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }),{threshold:.12}) : null;
  document.querySelectorAll('#body-inicio .panel').forEach((p,i)=>{ p.classList.add('reveal'); p.style.setProperty('--d', (i%3)*90+'ms'); io ? io.observe(p) : p.classList.add('in'); });
  // Sugestões digitadas no campo da TOPO AI.
  const inp = $('#askInput'); if (!inp || reduz) return;
  const frases = ['Quais leilões de imóvel estão ativos?','Quanto a Fernanda tem a receber?','Resuma o processo do leilão 2458','Crie uma tarefa para revisar o edital','O que está vencido nas contas?'];
  let f = 0, c = 0, apagando = false;
  clearInterval(window.__typer);
  window.__typer = setInterval(()=>{
    if (!document.body.contains(inp)){ clearInterval(window.__typer); return; }
    if (document.activeElement===inp || inp.value){ inp.placeholder='Pergunte à TOPO AI…'; return; }
    const alvo = frases[f];
    if (!apagando){ c++; if (c>alvo.length+18){ apagando=true; } }
    else { c-=2; if (c<=0){ apagando=false; c=0; f=(f+1)%frases.length; } }
    inp.placeholder = alvo.slice(0, Math.min(c, alvo.length)) + (c<=alvo.length && !apagando ? '▍' : '');
  }, 55);
}
function alertas(){
  const out = [];
  DB.tarefas.filter(t=>!t.feito && t.prazo && t.prazo < today()).forEach(t=>out.push({title:`Tarefa atrasada: ${t.texto}`,tag:'Atrasada',cls:'danger',href:'#tarefas'}));
  DB.leiloes.filter(l=>/Preparação|Captação|Análise/.test(l.status)).forEach(l=>out.push({title:`Leilão #${l.id} em ${l.status.toLowerCase()}`,tag:'Acompanhar',cls:'warn',href:'#leiloes'}));
  DB.receber.filter(t=>situacaoTitulo(t)==='Vencido').forEach(t=>out.push({title:`A receber vencido: ${t.descricao} (${brl(t.valor)})`,tag:'Vencido',cls:'danger',href:'#financeiro'}));
  out.push({title:'Integrações ainda não conectadas',tag:'8 sistemas',cls:'muted',href:'#integracoes'});
  return out;
}

let contaFiltro = '';
let extratoLido = null; // {conta, lancamentos}
function painelReceber(){
  const r = resumoReceber(contaFiltro);

function blocoExtrato(){

/* ---------- v0.16 — Backup dos dados (Etapa 1 da publicação) ---------- */
// Só lê os dados: gera uma cópia completa do que está salvo neste navegador. Não altera nada.
function montarBackup(){
  const contagem = {};
  Object.entries(DB).forEach(([k,v])=>{ if (Array.isArray(v)) contagem[k]=v.length; });
  return {sistema:'TOPO ONE', versao:'0.17', formato:'topo-one-backup-v1', exportado_em:nowISO(), chave:STORE_KEY, contagem, dados:structuredClone(DB)};
}
function nomeBackup(){ const d=new Date(), z=n=>String(n).padStart(2,'0'); return `topo-one-backup-${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}.json`; }
function painelBackup(){
  const b = montarBackup();
  const linhas = Object.entries(b.contagem).filter(([,n])=>n).map(([k,n])=>`<li><b>${esc(k)}</b>: ${n}</li>`).join('') || '<li>Nenhum registro ainda.</li>';
  return `<div class="panel" id="backupPanel" style="margin-bottom:16px"><div class="panel-head"><h2>Backup dos dados</h2><span class="status ok">Somente leitura</span></div>
    <p style="margin:0 0 10px">Os dados ficam no servidor do TOPO ONE. Exporte uma cópia periódica e guarde em local seguro: o arquivo traz tudo o que o seu perfil pode ver.</p>
    <ul class="plan-list">${linhas}</ul>
    <div class="form-actions" style="justify-content:flex-start;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" id="bkSave" type="button">Exportar backup (JSON)</button>
      <button class="btn btn-ghost" id="bkCopy" type="button">Copiar backup</button>
    </div>
    <small id="bkMsg" aria-live="polite" style="display:block;margin-top:8px"></small></div>`;
}
function ligarBackup(){
  const msg = t=>{ const m=document.getElementById('bkMsg'); if (m) m.textContent=t; };
  document.getElementById('bkSave').onclick = async ()=>{
    const texto = JSON.stringify(montarBackup(), null, 2);
    let dl = null; try { dl = await window.claude?.use?.('downloads'); } catch(e){ dl = null; }
    if (dl){
      try { await dl.save({filename:nomeBackup(), data:texto}); msg('Backup salvo. Guarde o arquivo em local seguro: ele contém dados financeiros.'); return; }
      catch(e){ if (e?.code==='declined'){ msg('Download cancelado.'); return; } if (e?.code==='rate_limited'){ msg('Já existe um pedido de download aberto. Tente de novo em instantes.'); return; } }
    }
    try { const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([texto],{type:'application/json'})); a.download=nomeBackup(); document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},1000); msg('Se o download não começou, use "Copiar backup".'); }
    catch(e){ msg('Este ambiente não permite download. Use "Copiar backup".'); }
  };
  document.getElementById('bkCopy').onclick = async ()=>{
    const texto = JSON.stringify(montarBackup(), null, 2);
    try { await navigator.clipboard.writeText(texto); msg('Backup copiado. Cole num arquivo de texto e salve como .json.'); }
    catch(e){ msg('Não foi possível copiar automaticamente neste navegador.'); }
  };
}
RENDER.configuracoes = (orig=>()=>{ orig(); body('configuracoes').insertAdjacentHTML('afterbegin', painelBackup()); ligarBackup(); })(RENDER.configuracoes);

/* ---------- Busca global e notificações ---------- */
function renderSearch(q){
  const box = $('#searchResults');
  if (!q){ box.hidden = true; return; }
  const t = q.toLowerCase();
  const hit = o=>Object.values(o).join(' ').toLowerCase().includes(t);
  const groups = [
    ['Leilões', DB.leiloes.filter(hit).slice(0,4).map(l=>({h:'#leiloes',ic:'gavel',t:`#${l.id} ${l.nome}`,s:`${l.cidade} · ${l.status}`}))],
    ['Lotes', DB.lotes.filter(hit).slice(0,3).map(o=>({h:'#lotes',ic:'box',t:o.descricao,s:o.status}))],
    ['Tarefas', DB.tarefas.filter(hit).slice(0,3).map(x=>({h:'#tarefas',ic:'check',t:x.texto,s:x.responsavel}))],
    ['Módulos', MODULES.filter(m=>(m.label+' '+m.sub).toLowerCase().includes(t)).slice(0,3).map(m=>({h:'#'+m.id,ic:m.icon,t:m.label,s:m.sub}))],
  ].filter(g=>g[1].length);
  box.innerHTML = groups.map(([g,items])=>`<div class="dd-title">${g}</div>${items.map(i=>`<a class="dd-item" href="${i.h}">${icon(i.ic)}<span>${esc(i.t)}<small>${esc(i.s)}</small></span></a>`).join('')}`).join('')
    + `<button class="dd-item" id="askAI">${icon('mic')}<span>Perguntar à TOPO AI<small>“${esc(q)}”</small></span></button>`;
  box.hidden = false;
  $('#askAI').onclick = ()=>{ box.hidden=true; $('#globalSearch').value=''; openAI(q); };
  box.querySelectorAll('a').forEach(a=>a.onclick=()=>{ box.hidden=true; $('#globalSearch').value=''; });
}
function renderNotifs(){
  const list = alertas();
  const btn = $('#notifBtn');
  btn.querySelector('.badge-dot')?.remove();
  const n = list.filter(a=>a.cls!=='muted').length;
  if (n) btn.insertAdjacentHTML('beforeend', `<span class="badge-dot">${n}</span>`);
  $('#notifPanel').innerHTML = `<div class="dd-title">Alertas</div>` + list.map(a=>`<a class="dd-item" href="${a.href}">${icon('alert')}<span>${esc(a.title)}<small>${esc(a.tag)}</small></span></a>`).join('');
  $('#notifPanel').querySelectorAll('a').forEach(a=>a.onclick=()=>{ $('#notifPanel').hidden=true; btn.setAttribute('aria-expanded','false'); });
}

  $('#notifBtn').onclick = e=>{ e.stopPropagation(); const p=$('#notifPanel'); p.hidden=!p.hidden; $('#notifBtn').setAttribute('aria-expanded', String(!p.hidden)); };
  document.addEventListener('click', e=>{ if (!e.target.closest('.search')) $('#searchResults').hidden=true; if (!e.target.closest('.notif-wrap')) $('#notifPanel').hidden=true; });
  window.addEventListener('hashchange', ()=>App.show(location.hash.slice(1)));
  initAI();
  renderNotifs();
  App.show(location.hash.slice(1) || 'inicio');
}
